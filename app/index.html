<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <meta name="color-scheme" content="dark" />
    <title>Comar-Fit</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('comar-fit:theme');
        const preference = ['system', 'original', 'dark', 'light', 'pink', 'pink-light'].includes(savedTheme)
          ? savedTheme : 'original';
        document.documentElement.dataset.theme = preference === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference;
        document.documentElement.dataset.themePreference = preference;
      } catch (_) {
        document.documentElement.dataset.theme = 'original';
      }
    </script>
    <link rel="icon" type="image/png" href="/comar-fit-favicon.png" />
    <link rel="apple-touch-icon" href="/comar-fit-app-icon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@100..900&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background text-on-surface font-body-md">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
