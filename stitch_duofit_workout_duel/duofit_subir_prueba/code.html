<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>DuoFit - Subir Prueba</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "surface-container": "#201f1f",
                    "on-primary-fixed-variant": "#004f54",

                    "on-secondary": "#4f0077",
                    "surface-container-low": "#1c1b1b",
                    "surface-tint": "#00dbe9",
                    "inverse-surface": "#e5e2e1",
                    "on-secondary-fixed": "#30004b",
                    "on-surface": "#e5e2e1",
                    "tertiary": "#fff3f6",
                    "tertiary-fixed": "#ffd8ea",
                    "secondary-fixed": "#f5d9ff",
                    "inverse-on-surface": "#313030",
                    "surface-container-high": "#2a2a2a",
                    "secondary": "#e5b4ff",
                    "on-tertiary-fixed-variant": "#890064",
                    "on-error": "#690005",
                    "on-tertiary": "#610046",
                    "on-primary-fixed": "#002022",
                    "on-tertiary-fixed": "#3c002a",
                    "surface-container-highest": "#353534",
                    "secondary-container": "#ad00fe",
                    "surface-bright": "#393939",
                    "primary-container": "#00f0ff",
                    "on-background": "#e5e2e1",
                    "surface-dim": "#131313",
                    "error": "#ffb4ab",
                    "surface": "#131313",
                    "on-secondary-container": "#fef0ff",
                    "on-tertiary-container": "#b40084",
                    "on-primary-container": "#006970",
                    "error-container": "#93000a",
                    "surface-variant": "#353534",
                    "on-surface-variant": "#b9cacb",
                    "tertiary-container": "#ffcbe4",
                    "on-secondary-fixed-variant": "#7000a7",
                    "background": "#131313",
                    "primary": "#dbfcff",
                    "outline": "#849495",
                    "primary-fixed": "#7df4ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"

            "spacing": {
                    "md": "24px",
                    "sm": "16px",
                    "margin_desktop": "48px",
                    "xl": "64px",
                    "margin_mobile": "20px",
                    "xs": "8px",
                    "lg": "40px",
                    "base": "4px",
                    "gutter": "16px"
            },
            "fontFamily": {
                    "headline-lg": ["Montserrat"],
                    "display-lg": ["Montserrat"],
                    "body-md": ["Inter"],

                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}]

          },
        },
      }

<style>
        .glass-card {
            background: rgba(28, 28, 30, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .action-gradient {
            background: linear-gradient(135deg, #00f0ff 0%, #ad00fe 100%);
        }
        .success-glow {
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #000000;
            color: #e5e2e1;
            overflow-x: hidden;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface/80 backdrop-blur-md border-b border-outline-variant/10 shadow-sm h-16">
<div class="flex justify-between items-center px-margin_mobile h-full w-full max-w-7xl mx-auto">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A close-up professional profile photo of a fit young man wearing high-end athletic gear. The lighting is dramatic and cinematic, emphasizing a dark-mode elite sports aesthetic with cool cyan and purple highlights. The background is a blurred high-tech gym interior with subtle bokeh effects." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD_-qsP_cTdT01Zr9o9hg0hxSx6gcRp6gHn4FblPz78g_kqPwB1k_qe-yIowtIX79c8et3cA28d_96n76YcjCAjF0FEwgIsEZwFEi-k0H70dho7ZsGO6hQk7Z-q9jVs-hUzTGLaNhP4bgAEahZIXTWFmrRjJYXr9Pd0dZYRNX2ejP7h2iLDDBxO8pyJsgG1GM36Z8bglEBxVdKX7vEOYKzpg2cyh6D0aLXUvmh_XJ6a8VqW_LKN5fvo"/>
</div>
<span class="font-display-md text-[20px] font-extrabold text-primary dark:text-primary-fixed-dim tracking-tighter">DuoFit</span>
</div>
<button class="material-symbols-outlined text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity active:scale-95">notifications</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 pb-32 px-margin_mobile max-w-2xl mx-auto w-full">
<!-- Header Section -->
<section class="mb-8 text-center">
<h1 class="font-display-md text-display-md text-primary-fixed-dim mb-2">Finalizaste tu rutina</h1>
<p class="font-body-md text-on-surface-variant">Ahora sube tu prueba para que Alex la valide</p>
</section>
<!-- Preview Area (Glassmorphism) -->
<div class="glass-card rounded-2xl p-4 mb-8 overflow-hidden relative group">
<div class="aspect-video rounded-xl bg-surface-container-low overflow-hidden relative border border-outline-variant/20">
<img class="w-full h-full object-cover opacity-80 group-hover:scale-105 transition-transform duration-700" data-alt="A high-contrast, professional action photograph of a runner's legs in mid-stride on a dark urban track at night. The image features vibrant neon cyan and violet lighting that creates long shadows. Subtle digital UI elements like a progress ring and heart rate wave are overlaid in a semi-transparent glass style to evoke an elite kinetic sports tracking app interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCHMScg8jR8abDZKrELcwCTPpw_t8FZddkXcflgoXuGPWL8p8TPRXwNDfoC2XQ00ifVdzLMuSGzTd2hhFK3uQ5ViSGPWVNWct0v1CyZSiPoS6bRnnpT_LvFny9uCK0YqKMCYijaBwo44ODUZLArj0fl55nxj1d6FV2jx3QIiZjkQ0SSnFp0sq5iYgxt9rO3WLl0dGdpM1187Ke6nmaK_XIy7p8qxMGmuvvgcjTIgl942rupMhO8-GV2"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent flex items-end p-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-md text-white">Vista previa seleccionada</span>
</div>
</div>
</div>
</div>
<!-- Upload Options Bento Grid -->
<section class="grid grid-cols-2 gap-4 mb-8">
<button class="glass-card p-6 rounded-2xl flex flex-col items-center justify-center gap-3 hover:bg-surface-bright transition-colors active:scale-95 group">
<div class="w-12 h-12 rounded-full bg-primary-container/10 flex items-center justify-center group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-primary-container text-3xl">photo_camera</span>
</div>
<span class="font-label-md text-on-surface">Tomar foto</span>
</button>
<button class="glass-card p-6 rounded-2xl flex flex-col items-center justify-center gap-3 hover:bg-surface-bright transition-colors active:scale-95 group">
<div class="w-12 h-12 rounded-full bg-secondary-container/10 flex items-center justify-center group-hover:bg-secondary-container/20 transition-colors">
<span class="material-symbols-outlined text-secondary text-3xl">image</span>
</div>
<span class="font-label-md text-on-surface">Galería</span>
</button>
<button class="glass-card p-6 rounded-2xl flex flex-col items-center justify-center gap-3 hover:bg-surface-bright transition-colors active:scale-95 group">
<div class="w-12 h-12 rounded-full bg-tertiary-container/10 flex items-center justify-center group-hover:bg-tertiary-container/20 transition-colors">
<span class="material-symbols-outlined text-tertiary-fixed-dim text-3xl">videocam</span>
</div>
<span class="font-label-md text-on-surface">Video corto</span>
</button>
<button class="glass-card p-6 rounded-2xl flex flex-col items-center justify-center gap-3 hover:bg-surface-bright transition-colors active:scale-95 group">
<div class="w-12 h-12 rounded-full bg-primary-fixed/10 flex items-center justify-center group-hover:bg-primary-fixed/20 transition-colors">
<span class="material-symbols-outlined text-primary-fixed text-3xl">screenshot_region</span>
</div>
<span class="font-label-md text-on-surface text-center">Captura de app<br/><span class="text-[10px] opacity-60 uppercase">(Strava/Nike)</span></span>
</button>
</section>
<!-- Form Fields -->
<section class="space-y-6 mb-8">
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant ml-1">Distancia (km)</label>
<input class="w-full h-14 bg-surface-container-high border-none rounded-xl px-4 font-stats-num text-primary focus:ring-2 focus:ring-primary-container" placeholder="5.2" type="text"/>
</div>
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant ml-1">Duración</label>
<input class="w-full h-14 bg-surface-container-high border-none rounded-xl px-4 font-stats-num text-primary focus:ring-2 focus:ring-primary-container" placeholder="28:45" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant ml-1">Nota opcional</label>
<textarea class="w-full bg-surface-container-high border-none rounded-xl p-4 font-body-md text-on-surface focus:ring-2 focus:ring-primary-container" placeholder="¿Cómo te sentiste hoy?" rows="3"></textarea>
</div>
<!-- Privacy Notice -->
<div class="flex gap-3 items-start p-4 bg-primary-container/5 rounded-xl border border-primary-container/10">
<span class="material-symbols-outlined text-primary-container text-xl shrink-0">info</span>
<p class="font-body-md text-sm text-on-surface-variant italic leading-relaxed">
                    Aviso de privacidad: La prueba solo necesita mostrar fecha, distancia y duración.
                </p>
</div>
</section>
<!-- CTA Button -->
<button class="w-full h-16 rounded-xl action-gradient flex items-center justify-center gap-3 success-glow hover:opacity-90 active:scale-95 transition-all mb-12">
<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 1;">send</span>
<span class="font-label-md text-on-primary-container text-lg font-bold">Enviar prueba</span>
</button>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface-container dark:bg-surface-container border-t border-outline-variant/20 shadow-[0_-4px_10px_rgba(0,0,0,0.3)]">
<div class="flex justify-around items-center w-full h-20 pb-safe px-2">
<!-- Inicio -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant p-2 hover:bg-surface-bright transition-colors active:scale-90" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label-md text-label-md">Inicio</span>
</a>
<!-- Rutina -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant p-2 hover:bg-surface-bright transition-colors active:scale-90" href="#">
<span class="material-symbols-outlined">fitness_center</span>
<span class="font-label-md text-label-md">Rutina</span>
</a>
<!-- Duelo -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant p-2 hover:bg-surface-bright transition-colors active:scale-90" href="#">
<span class="material-symbols-outlined">swords</span>
<span class="font-label-md text-label-md">Duelo</span>
</a>
<!-- Pruebas (ACTIVE) -->
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary-container text-on-secondary-container dark:text-on-secondary-container rounded-full px-4 py-1 transition-all duration-200 active:scale-90" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">assignment</span>
<span class="font-label-md text-label-md">Pruebas</span>
</a>
<!-- Perfil -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant p-2 hover:bg-surface-bright transition-colors active:scale-90" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-md text-label-md">Perfil</span>
</a>
</div>
</nav>
<script>
        // Simple micro-interaction for the upload cards
        document.querySelectorAll('.glass-card').forEach(card => {
            card.addEventListener('click', function() {
                this.classList.add('ring-2', 'ring-primary-container');
                setTimeout(() => {
                    this.classList.remove('ring-2', 'ring-primary-container');
                }, 300);
            });
        });
    </script>
</body></html>
